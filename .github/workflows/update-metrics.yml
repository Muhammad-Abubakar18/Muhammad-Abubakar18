name: Update Contribution Activity

on:
  schedule:
    - cron: "30 0 * * *"   # runs daily, 30 min after the stats workflow
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_PAT }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: profile/activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_days: 30
          plugin_activity_visibility: all
