name: Update README Stats

on:
  schedule:
    # Run every day at midnight UTC
    - cron: "0 0 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

  # Update stats whenever this workflow itself changes
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-readme-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Generate GitHub Stats
      # ---------------------------------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&
            show_icons=true&
            include_all_commits=true&
            count_private=true&
            hide_rank=false&
            theme=tokyonight&
            hide_border=true&
            custom_title=Muhammad Abubakar's GitHub Stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Generate Top Languages
      # ---------------------------------------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&
            layout=compact&
            langs_count=6&
            count_private=true&
            theme=tokyonight&
            hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Generate Contribution Streak
      # ---------------------------------------------------------
      - name: Generate Contribution Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=${{ github.repository_owner }}&
            theme=tokyonight&
            hide_border=true&
            disable_animations=true&
            locale=en&
            timezone=Asia/Karachi&
            starting_year=2024
          path: profile/streak.svg
          token: ${{ secrets.STATS_PAT }}

      # ---------------------------------------------------------
      # Commit generated SVG files
      # ---------------------------------------------------------
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/streak.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats"

          git push
